<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub | Login</title>

    <style>

        body{
            background-color:rgb(174,220,234);
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin:0;
        }

        header{
            background:#2563eb;
            color:white;
            padding:15px;
            text-align:center;
        }

        .login-box{
            background:white;
            width:350px;
            margin:50px auto;
            padding:25px;
            border-radius:10px;
            text-align:center;
        }

        h1{
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        footer{
            background:#2563eb;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }

    </style>

</head>

<body>

<header>

<h2>🎓 StudentHub</h2>

</header>

<h1>🔐 Login</h1>

<div class="login-box">



<p>Please login to continue.</p>

<form action="dashboard.html">

<input type="text" placeholder="Enter Username" required>

<br>

<input type="password" placeholder="Enter Password" required>

<br><br>

<button type="submit">Login</button>

</form>

<br>



<p>Don't have an account? <a href="register.html">register</a>
</p>
</div>

<footer>

<p>© 2026 StudentHub | Login</p>

</footer>

</body>

</html>
