<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudentHub | Register</title>

<style>

body{
    margin:0;
    font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    background:rgb(174,220,234);
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;
}

.register-box{
    width:380px;
    background:white;
    margin:50px auto;
    padding:30px;
    border-radius:10px;
}

h1{
    text-align:center;
}

p{
    text-align:center;
}

input{
    width:95%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid gray;
    border-radius:5px;
}

.button{
    width:100%;
    padding:10px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

.button:hover{
    background:#1d4ed8;
}

.login{
    text-align:center;
    margin-top:20px;
}

.login a{
    text-decoration:none;
    color:#2563eb;
}

footer{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

</style>
</head>

<body>
<header>
<h2>🎓 StudentHub</h2>
</header>

<div class="register-box">
<h1>📝 Register</h1>
<p>Create Your StudentHub Account</p>
<form action="login.html">
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="text" placeholder="Student ID" required>
<input type="password" placeholder="Create Password" required>
<input type="password" placeholder="Confirm Password" required>
<button class="button" type="submit">
Register
</button>
</form>


<div class="login">
<p>
Already have an account?
<a href="login.html">Login</a>
</p>
</div>
</div>

<footer>
<p>© 2026 StudentHub | Register</p>
</footer>
</body>
</html>
